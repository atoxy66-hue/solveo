<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOLVEO — Toutes les réponses, au même endroit</title>

<style>
*{box-sizing:border-box}
:root{--red:#ff2424;--bg:#080808;--panel:#151515;--border:#303030}
body{margin:0;background:var(--bg);color:#f5f5f5;font-family:Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:#090909;border-bottom:1px solid #292929;padding:17px 6%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px}
.logo{font-size:30px;font-weight:900;letter-spacing:4px;color:var(--red);cursor:pointer;text-shadow:0 0 15px #ff242466}
nav{display:flex;gap:18px;flex-wrap:wrap}
nav button{background:none;border:0;color:#ddd;cursor:pointer;font-size:14px}
nav button:hover{color:var(--red)}
.hero{text-align:center;padding:65px 20px;background:radial-gradient(ellipse at top,#420909,#080808 70%)}
.hero h1{font-size:clamp(38px,7vw,65px);margin:0}
.hero h1 span{color:var(--red)}
.hero p{color:#bbb}
.search{max-width:650px;margin:28px auto 0;display:flex;gap:10px}
.search input{flex:1;min-width:0;padding:15px;background:#171717;border:1px solid #444;color:white;border-radius:8px}
.primary{background:var(--red);border:0;color:white;padding:14px 19px;border-radius:8px;font-weight:bold;cursor:pointer}
main{max-width:1200px;margin:auto;padding:35px 22px;min-height:55vh}
h2.section-title{font-size:26px;margin:15px 0 24px}
h2 span{color:var(--red)}
.category-grid,.guide-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:17px}
.category-card,.guide-card{background:linear-gradient(145deg,#191919,#101010);border:1px solid var(--border);border-radius:12px;padding:22px;transition:.2s}
.category-card:hover,.guide-card:hover{border-color:var(--red);transform:translateY(-3px);box-shadow:0 0 17px #ff242422}
.category-card{cursor:pointer}
.category-icon{font-size:32px}
.category-card p,.guide-card p{color:#aaa;line-height:1.6}
.guide-card{display:flex;flex-direction:column;gap:9px}
.guide-card h3{margin:0;font-size:18px}
.tag{color:#ff5555;font-size:12px;text-transform:uppercase;letter-spacing:1px}
.actions{display:flex;gap:8px;margin-top:auto;padding-top:10px;flex-wrap:wrap}
.small,.back{background:#252525;color:white;border:1px solid #444;padding:9px 12px;border-radius:6px;cursor:pointer}
.small.red{background:#620c0c;border-color:#a51b1b}
.article{max-width:850px;margin:auto}
.back{padding:10px 15px;margin-bottom:20px}
.article h1{font-size:clamp(29px,5vw,43px)}
.intro{font-size:18px;line-height:1.8;color:#ccc;border-left:3px solid var(--red);padding-left:17px}
.article-section{margin:30px 0;color:#ddd;line-height:1.85}
.article-section h2{font-size:22px;color:var(--red)}
.article-section li{margin:8px 0}
.article-section a{color:#ff7777}
.tip{padding:17px;background:#211010;border:1px solid #642020;border-radius:8px}
.empty{padding:25px;background:#151515;color:#aaa;border-radius:8px}
.pagination{display:flex;justify-content:center;align-items:center;gap:12px;margin:25px 0;flex-wrap:wrap}
footer{text-align:center;border-top:1px solid #292929;padding:28px;color:#777}
button:disabled{opacity:.4;cursor:not-allowed}
@media(max-width:600px){
 header{justify-content:center}
 nav{justify-content:center}
 .search{flex-direction:column}
}
</style>
</head>

<body>

<header>
 <div class="logo" onclick="home()">SOLVEO</div>
 <nav>
  <button onclick="home()">Accueil</button>
  <button onclick="categoriesPage()">Catégories</button>
  <button onclick="favoritesPage()">⭐ Favoris</button>
 </nav>
</header>

<section class="hero" id="hero">
 <h1>Bienvenue sur <span>SOLVEO</span></h1>
 <p>Toutes les réponses, au même endroit.</p>
 <p><strong id="totalGuides">1 000 guides disponibles</strong></p>
 <div class="search">
  <input id="searchInput" placeholder="Rechercher parmi les 1 000 guides..." onkeydown="if(event.key==='Enter')search()">
  <button class="primary" onclick="search()">Rechercher</button>
 </div>
</section>

<main><div id="content"></div></main>

<footer>
 <strong style="color:#ff2424;letter-spacing:3px">SOLVEO</strong>
 <p>Toutes les réponses, au même endroit.</p>
 <p>© 2026 SOLVEO</p>
</footer>

<script>

/* =========================================
   1. CATÉGORIES
========================================= */

const categories=[
 {name:"Informatique",icon:"💻",description:"Ordinateurs, logiciels et Internet."},
 {name:"Éducation",icon:"📚",description:"Apprentissage, organisation et connaissances."},
 {name:"Réparation",icon:"🔧",description:"Diagnostic et entretien des équipements."},
 {name:"Maison",icon:"🏠",description:"Entretien, organisation et énergie."},
 {name:"Sécurité",icon:"🛡️",description:"Protection des comptes et des données."},
 {name:"Technologie",icon:"⚡",description:"Innovations et fonctionnement des technologies."}
];

/* =========================================
   2. SUJETS DES GUIDES
========================================= */

const topics={

"Informatique":[
"Ordinateurs de bureau","Ordinateurs portables","Processeurs","Mémoire RAM",
"Disques SSD","Disques durs","Cartes graphiques","Cartes mères",
"Alimentations PC","Boîtiers informatiques","Systèmes Windows","Systèmes Linux",
"Mac et macOS","Navigateurs Internet","Réseaux Wi-Fi","Réseaux Ethernet",
"Adresses IP","Serveurs informatiques","Stockage cloud","Sauvegardes",
"Fichiers numériques","Archives ZIP","Logiciels de bureautique","Applications mobiles",
"Imprimantes informatiques","Écrans et moniteurs","Périphériques USB","Maintenance informatique"
],

"Éducation":[
"Organisation scolaire","Méthodes de mémorisation","Révisions efficaces","Prise de notes",
"Lecture et compréhension","Expression écrite","Expression orale","Apprentissage des langues",
"Vocabulaire anglais","Grammaire française","Orthographe","Conjugaison",
"Mathématiques","Fractions","Pourcentages","Géométrie",
"Sciences physiques","Chimie au collège","Biologie","Histoire",
"Géographie","Recherche documentaire","Exposés scolaires","Dissertations",
"Gestion du temps","Préparation aux examens","Orientation scolaire","Esprit critique"
],

"Réparation":[
"Ordinateurs en panne","Téléphones portables","Batteries rechargeables","Écrans de téléphone",
"Claviers informatiques","Souris informatiques","Imprimantes","Casques audio",
"Écouteurs sans fil","Consoles de jeux","Manettes de jeu","Téléviseurs",
"Routeurs Internet","Connexions Wi-Fi","Disques de stockage","Ventilateurs",
"Appareils électroménagers","Réfrigérateurs","Lave-linge","Lave-vaisselle",
"Petits appareils électriques","Télécommandes","Chargeurs","Câbles électriques",
"Écrans d'ordinateur","Entretien des appareils","Diagnostic des pannes","Préparation des réparations"
],

"Maison":[
"Économies d'électricité","Économies d'eau","Organisation du logement","Rangement des chambres",
"Nettoyage des surfaces","Entretien du réfrigérateur","Conservation des aliments","Tri des déchets",
"Recyclage du papier","Compostage","Chauffage domestique","Isolation thermique",
"Humidité intérieure","Ventilation du logement","Entretien des plantes","Organisation des courses",
"Réduction du gaspillage","Préparation d'un déménagement","Organisation de la cuisine","Entretien du linge",
"Nettoyage des sols","Éclairage domestique","Équipements économes","Gestion des documents",
"Aménagement du bureau","Entretien des appareils","Prévention des petites fuites","Organisation quotidienne"
],

"Sécurité":[
"Mots de passe","Authentification à deux facteurs","Hameçonnage","Arnaques en ligne",
"Réseaux sociaux","Vie privée numérique","Données personnelles","Sécurité des smartphones",
"Messagerie électronique","Achats en ligne","Comptes de jeu","Logiciels malveillants",
"Fuites de données","Wi-Fi public","Cookies Internet","Autorisations des applications",
"Faux concours","Fausse assistance technique","Sauvegardes sécurisées","Sécurité des navigateurs",
"Protection des photos","Comptes compromis","Identité numérique","Sécurité des enfants en ligne",
"Confidentialité des données","Reconnaissance des faux sites","Mises à jour de sécurité","Protection des appareils"
],

"Technologie":[
"Intelligence artificielle","Réalité virtuelle","Réalité augmentée","Objets connectés",
"Impression 3D","Technologie GPS","Batteries lithium-ion","Panneaux solaires",
"Bluetooth","Réseaux 5G","Véhicules électriques","Écrans OLED",
"Écrans LCD","Robotique","Drones","Streaming vidéo",
"Centres de données","Maisons intelligentes","Écrans tactiles","Technologies vocales",
"Capteurs électroniques","Technologies spatiales","Énergies renouvelables","Cloud computing",
"Technologies médicales","Technologies automobiles","Domotique","Innovations numériques"
]

};

/* =========================================
   3. FORMATS DE TITRES
   Les titres ne contiennent aucun deux-points.
========================================= */

const titleTemplates=[
 subject=>"Les bases à connaître sur le sujet «"+subject+"»",
 subject=>"Les points essentiels pour comprendre «"+subject+"»",
 subject=>"Les bonnes pratiques concernant «"+subject+"»",
 subject=>"Les erreurs à éviter avec le sujet «"+subject+"»",
 subject=>"Comment approfondir ses connaissances sur «"+subject+"»",
 subject=>"Les problèmes fréquents liés au sujet «"+subject+"»"
];

/* =========================================
   4. SOURCES DE RÉFÉRENCE
========================================= */

const sources={
"Informatique":[
 ["Microsoft Support","https://support.microsoft.com/fr-fr"],
 ["MDN Web Docs","https://developer.mozilla.org/fr/"]
],
"Éducation":[
 ["Éduscol","https://eduscol.education.fr/"],
 ["Onisep","https://www.onisep.fr/"]
],
"Réparation":[
 ["iFixit","https://www.ifixit.com/"],
 ["Assistance Samsung","https://www.samsung.com/fr/support/"]
],
"Maison":[
 ["ADEME","https://agirpourlatransition.ademe.fr/particuliers/"],
 ["Service public","https://www.service-public.fr/"]
],
"Sécurité":[
 ["CNIL","https://www.cnil.fr/"],
 ["Cybermalveillance","https://www.cybermalveillance.gouv.fr/"],
 ["ANSSI","https://cyber.gouv.fr/"]
],
"Technologie":[
 ["CNIL","https://www.cnil.fr/"],
 ["Commission européenne","https://digital-strategy.ec.europa.eu/fr"]
]
};

/* =========================================
   5. DESCRIPTIONS ET CONSEILS
========================================= */

const descriptions={
"Informatique":"Ce guide présente les éléments essentiels liés à ce sujet informatique, leur fonctionnement et les points à connaître pour bien les utiliser.",
"Éducation":"Ce guide présente une méthode pour mieux comprendre ce sujet, organiser son apprentissage et progresser étape par étape.",
"Réparation":"Ce guide aide à comprendre le fonctionnement de l'équipement, à reconnaître les problèmes courants et à savoir quand demander une intervention professionnelle.",
"Maison":"Ce guide présente des méthodes pratiques pour mieux organiser, entretenir et gérer les équipements et les espaces de la maison.",
"Sécurité":"Ce guide explique les principaux risques, les bonnes pratiques de prévention et les moyens de protéger les personnes et les informations.",
"Technologie":"Ce guide présente le fonctionnement de cette technologie, ses usages, ses possibilités et les points importants à connaître."
};

const conseils={
"Informatique":"Vérifie toujours la compatibilité des équipements et logiciels. Consulte la documentation officielle avant de modifier un réglage important.",
"Éducation":"Avance progressivement, vérifie ce que tu as compris et utilise des exercices pour mettre les connaissances en pratique.",
"Réparation":"Commence par les vérifications externes sans danger. Ne démonte jamais un appareil électrique ou une batterie sans les compétences nécessaires.",
"Maison":"Adapte les méthodes au logement et aux équipements. Lis les notices et demande l'aide d'un adulte ou d'un professionnel pour les interventions techniques.",
"Sécurité":"Ne communique jamais tes mots de passe ou codes de validation. En cas de doute, vérifie les informations auprès d'un organisme officiel.",
"Technologie":"Compare plusieurs solutions, vérifie les caractéristiques techniques et consulte les recommandations des fabricants."
};

/* =========================================
   6. CRÉATION DES 1 000 GUIDES
========================================= */

let guides=[];
let idCounter=1;

for(const category of categories){

 const name=category.name;
 const subjects=topics[name];

 for(let i=0;i<167;i++){

  const subject=subjects[i%subjects.length];
  const templateIndex=Math.floor(i/subjects.length)%titleTemplates.length;

  const title=titleTemplates[templateIndex](subject);

  const guide={
   id:idCounter++,
   category:name,
   title:title,
   intro:descriptions[name],

   details:
    "Le sujet de ce guide est : "+subject+". "+
    descriptions[name]+" "+
    "Pour bien comprendre ce domaine, il est utile d'identifier les éléments principaux, leur rôle, leurs limites et les situations dans lesquelles ils sont utilisés. "+
    "Les caractéristiques peuvent varier selon les modèles, les fabricants et les conditions d'utilisation. "+
    "Prends le temps de comparer les informations et de vérifier les recommandations adaptées à ta situation.",

   advice:
    conseils[name]+" "+
    "Note les informations importantes, vérifie les résultats et privilégie toujours les sources fiables.",

   sources:sources[name]
  };

  guides.push(guide);
 }
}

/* 1 000 guides au total */

guides=guides.slice(0,1000);

/* =========================================
   7. NAVIGATION ET FAVORIS
========================================= */

let currentView="home";
let currentCategory="";
let currentQuery="";
let previousView="home";
let currentPage=1;
const pageSize=24;

function esc(s){
 return String(s).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
 }[c]));
}

function favorites(){
 try{
  return JSON.parse(localStorage.getItem("solveoFavorites1000")||"[]");
 }catch{
  return [];
 }
}

function toggleFavorite(id){
 let f=favorites();

 if(f.includes(id))f=f.filter(x=>x!==id);
 else f.push(id);

 localStorage.setItem("solveoFavorites1000",JSON.stringify(f));

 if(currentView==="article")openGuide(id);
 else if(currentView==="favorites")favoritesPage();
 else if(currentView==="category")openCategory(currentCategory);
 else if(currentView==="results")search(currentQuery);
 else home();
}

function card(g){
 const fav=favorites().includes(g.id);

 return `
 <div class="guide-card">
  <span class="tag">${esc(g.category)}</span>
  <h3>${esc(g.title)}</h3>
  <p>${esc(g.intro)}</p>
  <div class="actions">
   <button class="small red" onclick="openGuide(${g.id})">Lire le guide</button>
   <button class="small" onclick="toggleFavorite(${g.id})">
    ${fav?"★ Favori":"☆ Favori"}
   </button>
  </div>
 </div>`;
}

function hideHero(){
 document.getElementById("hero").style.display="none";
}

function showHero(){
 document.getElementById("hero").style.display="block";
}

function renderCards(list,page=1){
 const totalPages=Math.max(1,Math.ceil(list.length/pageSize));
 currentPage=Math.min(Math.max(1,page),totalPages);

 const start=(currentPage-1)*pageSize;
 const visible=list.slice(start,start+pageSize);

 return `
  <div class="guide-grid">
   ${visible.map(card).join("")}
  </div>

  <div class="pagination">
   <button class="small" onclick="changePage(${currentPage-1})"
    ${currentPage===1?"disabled":""}>← Précédent</button>

   <span>Page ${currentPage} / ${totalPages}</span>

   <button class="small" onclick="changePage(${currentPage+1})"
    ${currentPage===totalPages?"disabled":""}>Suivant →</button>
  </div>
 `;
}

function changePage(page){
 if(currentView==="category")openCategory(currentCategory,page);
 else if(currentView==="results")search(currentQuery,page);
 else if(currentView==="favorites")favoritesPage(page);
}

/* =========================================
   8. ACCUEIL
========================================= */

function home(){
 currentView="home";
 previousView="home";
 showHero();

 document.getElementById("content").innerHTML=`
  <h2 class="section-title">Explore les <span>catégories</span></h2>

  <div class="category-grid">
   ${categories.map(c=>{
    const count=guides.filter(g=>g.category===c.name).length;

    return `
    <div class="category-card" onclick="openCategory('${c.name}')">
     <div class="category-icon">${c.icon}</div>
     <h3>${c.name}</h3>
     <p>${c.description}</p>
     <small style="color:#ff5555">${count} guides disponibles</small>
    </div>`;
   }).join("")}
  </div>

  <h2 class="section-title" style="margin-top:45px">
   Découvrir des <span>guides</span>
  </h2>

  ${renderCards(guides.slice(0,12),1)}
 `;
}

/* =========================================
   9. CATÉGORIES
========================================= */

function categoriesPage(){
 currentView="categories";
 previousView="categories";
 hideHero();

 document.getElementById("content").innerHTML=`
  <h2 class="section-title">Toutes les <span>catégories</span></h2>

  <div class="category-grid">
   ${categories.map(c=>{
    const count=guides.filter(g=>g.category===c.name).length;

    return `
    <div class="category-card" onclick="openCategory('${c.name}')">
     <div class="category-icon">${c.icon}</div>
     <h3>${c.name}</h3>
     <p>${c.description}</p>
     <small style="color:#ff5555">${count} guides</small>
    </div>`;
   }).join("")}
  </div>
 `;
}

function openCategory(name,page=1){
 currentView="category";
 currentCategory=name;
 previousView="category";
 hideHero();

 const list=guides.filter(g=>g.category===name);

 document.getElementById("content").innerHTML=`
  <button class="back" onclick="categoriesPage()">← Catégories</button>
  <h2 class="section-title">
   ${esc(name)} <span>— ${list.length} guides</span>
  </h2>
  <div id="categoryCards">${renderCards(list,page)}</div>
 `;
}

/* =========================================
   10. AFFICHAGE D'UN GUIDE
========================================= */

function openGuide(id){
 const g=guides.find(x=>x.id===id);
 if(!g)return;

 if(currentView!=="article")previousView=currentView;

 currentView="article";
 hideHero();

 document.getElementById("content").innerHTML=`
  <div class="article">

   <button class="back" onclick="goBack()">← Retour</button>

   <div class="tag">${esc(g.category)}</div>
   <h1>${esc(g.title)}</h1>

   <p class="intro">${esc(g.intro)}</p>

   <button class="small red" onclick="toggleFavorite(${g.id})">
    ${favorites().includes(g.id)?"★ Retirer des favoris":"☆ Ajouter aux favoris"}
   </button>

   <section class="article-section">
    <h2>1. Comprendre le sujet</h2>
    <p>${esc(g.details)}</p>
   </section>

   <section class="article-section">
    <h2>2. Conseils pratiques</h2>
    <div class="tip">${esc(g.advice)}</div>
   </section>

   <section class="article-section">
    <h2>3. À retenir</h2>
    <p>
     Les situations peuvent varier. Vérifie les caractéristiques de ton
     matériel ou les recommandations officielles avant toute décision.
     Pour une intervention technique ou une situation importante,
     demande conseil à une personne compétente.
    </p>
   </section>

   <section class="article-section">
    <h2>📚 Sources pour approfondir</h2>
    ${g.sources.map(s=>`
     <p><a href="${s[1]}" target="_blank" rel="noopener noreferrer">
      ${esc(s[0])} ↗
     </a></p>
    `).join("")}
   </section>

  </div>
 `;
}

function goBack(){
 if(previousView==="category"&&currentCategory)openCategory(currentCategory);
 else if(previousView==="favorites")favoritesPage();
 else if(previousView==="results")search(currentQuery);
 else if(previousView==="categories")categoriesPage();
 else home();
}

/* =========================================
   11. FAVORIS
========================================= */

function favoritesPage(page=1){
 currentView="favorites";
 previousView="favorites";
 hideHero();

 const list=guides.filter(g=>favorites().includes(g.id));

 document.getElementById("content").innerHTML=`
  <h2 class="section-title">⭐ Mes <span>favoris</span></h2>

  ${list.length
   ?renderCards(list,page)
   :`<div class="empty">
      Aucun favori pour le moment.
      Ajoute un guide avec le bouton ☆ Favori.
     </div>`
  }
 `;
}

/* =========================================
   12. RECHERCHE
========================================= */

function search(query,page=1){
 if(typeof query!=="string"){
  query=document.getElementById("searchInput").value;
 }

 currentQuery=query;
 currentView="results";
 previousView="results";
 showHero();

 document.getElementById("searchInput").value=query;

 const q=query.trim().toLowerCase();

 const results=guides.filter(g=>
  g.title.toLowerCase().includes(q)||
  g.category.toLowerCase().includes(q)||
  g.intro.toLowerCase().includes(q)||
  g.details.toLowerCase().includes(q)||
  g.advice.toLowerCase().includes(q)
 );

 document.getElementById("content").innerHTML=`
  <h2 class="section-title">Résultats de <span>recherche</span></h2>

  <p style="color:#aaa">
   ${results.length} résultat(s) pour « ${esc(query)} »
  </p>

  ${results.length
   ?renderCards(results,page)
   :`<div class="empty">Aucun guide trouvé. Essaie un autre mot-clé.</div>`
  }
 `;
}

/* =========================================
   13. DÉMARRAGE
========================================= */

document.getElementById("totalGuides").textContent=
 guides.length.toLocaleString("fr-FR")+" guides disponibles";

home();

</script>
</body>
</html>
