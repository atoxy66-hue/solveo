const raw={
"Informatique":[
["Comprendre le fonctionnement d'un ordinateur","Un ordinateur reçoit, traite, stocke et transmet des informations.","Le processeur exécute les instructions. La RAM conserve temporairement les données des logiciels actifs. Le SSD conserve durablement les fichiers. La carte mère relie les composants. La carte graphique traite notamment les images. Ces éléments travaillent ensemble lorsque tu ouvres un programme.","Pour comprendre les performances, regarde plusieurs composants : le processeur, la mémoire vive, le stockage et, selon l'usage, la carte graphique."],
["Bien organiser ses fichiers et dossiers","Une organisation claire facilite la recherche et protège les documents importants.","Crée des dossiers principaux comme Documents, Images, Projets et Archives. Utilise des noms précis avec une date ou une version. Sur Windows, l'Explorateur permet de rechercher un fichier par son nom, son type ou sa date de modification. Une sauvegarde indépendante permet de récupérer des documents en cas de panne.","Ne conserve pas tous tes fichiers sur le Bureau. Fais une copie indépendante des documents importants."],
["Comprendre les systèmes d'exploitation","Le système d'exploitation permet à l'utilisateur et aux logiciels de communiquer avec le matériel.","Windows, macOS, Linux, Android et iOS sont des systèmes d'exploitation. Ils gèrent la mémoire, les fichiers, les périphériques, les comptes et l'exécution des applications. Les logiciels sont conçus pour fonctionner sur certains systèmes et certaines versions.","Vérifie la compatibilité d'un logiciel avec ton système avant de l'installer."],
["Installer un logiciel correctement","L'installation ajoute un programme à ton appareil afin que tu puisses l'utiliser.","Télécharge les logiciels depuis le site officiel de leur éditeur ou une boutique reconnue. Vérifie le nom du programme, sa compatibilité et les autorisations demandées. Un installateur peut proposer des composants supplémentaires : lis chaque écran avant de continuer.","Évite les sites de téléchargement inconnus et les programmes qui promettent des performances miraculeuses."],
["Comprendre la mémoire RAM","La mémoire vive conserve temporairement les données dont les programmes ont besoin.","Lorsque plusieurs applications fonctionnent simultanément, elles utilisent de la RAM. Si la mémoire disponible devient insuffisante, le système peut déplacer certaines données vers le stockage, généralement plus lent. La quantité nécessaire dépend des logiciels utilisés et de leurs besoins.","Pour choisir un ordinateur, vérifie la quantité de RAM mais aussi la possibilité de l'augmenter."],
["Comprendre les SSD et les disques durs","Les SSD et les disques durs servent à conserver les fichiers même lorsque l'ordinateur est éteint.","Un disque dur traditionnel utilise des plateaux magnétiques en rotation. Un SSD utilise de la mémoire flash et n'a pas de pièces mobiles de ce type. Les SSD offrent généralement des temps d'accès plus rapides. La capacité se mesure habituellement en Go ou en To.","Choisis le stockage en fonction de tes logiciels, photos, vidéos et besoins de sauvegarde."],
["Se connecter à un réseau Wi-Fi","Le Wi-Fi permet de relier sans fil un appareil à un réseau local.","Le routeur ou la box diffuse un réseau sans fil. L'appareil sélectionne le réseau, s'authentifie avec le mot de passe puis reçoit les paramètres nécessaires pour communiquer. La qualité dépend de la distance, des obstacles, des interférences et du matériel.","Place la box dans un endroit dégagé et utilise un mot de passe Wi-Fi robuste."],
["Comprendre les navigateurs Internet","Un navigateur affiche les pages Web et permet d'interagir avec les sites.","Le navigateur reçoit des ressources comme HTML, CSS, images et JavaScript. Il les interprète pour afficher une page. Les navigateurs proposent aussi des onglets, favoris, téléchargements, extensions et paramètres de confidentialité.","Mets ton navigateur à jour et limite les extensions aux outils réellement utiles."],
["Nettoyer l'espace de stockage","Libérer de l'espace peut faciliter la gestion des fichiers et des mises à jour.","Commence par repérer les fichiers volumineux et les applications inutilisées. Sur Windows, les paramètres de stockage indiquent les catégories qui occupent de la place. Vérifie les téléchargements et la corbeille avant de supprimer quoi que ce soit.","Ne supprime jamais un dossier système simplement parce que son nom semble inutile."],
["Comprendre les extensions de fichiers","L'extension indique généralement le type de fichier et le logiciel susceptible de l'ouvrir.","Un fichier .jpg est généralement une image, .pdf un document PDF, .docx un document Word et .html une page Web. L'extension ne garantit pas que le fichier est sûr : un fichier malveillant peut avoir un nom trompeur.","Affiche les extensions dans l'Explorateur et vérifie les fichiers inattendus avant de les ouvrir."],
["Faire une sauvegarde de son ordinateur","Une sauvegarde est une copie permettant de récupérer des données après une perte ou une panne.","Les fichiers peuvent disparaître à cause d'une panne, d'une erreur de manipulation ou d'un incident informatique. Une sauvegarde peut être stockée sur un disque externe ou un service en ligne. Une synchronisation seule n'est pas toujours suffisante, car une suppression peut être synchronisée.","Garde au moins une copie indépendante et vérifie que tu peux réellement restaurer tes fichiers."],
["Comprendre les mises à jour","Les mises à jour corrigent des défauts et peuvent améliorer la sécurité et la compatibilité.","Un système ou un logiciel évolue au fil du temps. Les éditeurs publient des mises à jour pour corriger des bugs, améliorer des fonctions et réparer des failles de sécurité. Certaines mises à jour nécessitent un redémarrage.","Active les mises à jour automatiques lorsque c'est possible et évite les versions provenant de sources inconnues."],
["Découvrir le cloud","Le cloud permet d'utiliser des ressources informatiques hébergées sur des serveurs distants.","Un service cloud peut stocker des fichiers, synchroniser plusieurs appareils ou exécuter des applications à distance. Les données transitent par Internet et sont conservées sur l'infrastructure du fournisseur selon ses conditions.","Vérifie les paramètres de partage, la confidentialité et les possibilités d'exporter tes données."],
["Comprendre les fichiers compressés","La compression regroupe des fichiers et peut réduire leur taille ou faciliter leur transport.","Les formats ZIP et 7z regroupent plusieurs éléments dans une archive. La compression sans perte permet de retrouver les fichiers originaux. Certains formats réduisent davantage la taille que d'autres selon le contenu.","N'ouvre pas une archive inattendue provenant d'un expéditeur inconnu."],
["Résoudre les problèmes courants de Windows","Une panne logicielle peut parfois être résolue par des vérifications simples.","Commence par noter le message d'erreur, redémarre si cela est approprié, vérifie les mises à jour et observe si le problème concerne une application ou tout le système. Les paramètres Windows proposent des outils de dépannage et un historique des mises à jour.","Avant une opération importante, sauvegarde les documents personnels et note les changements effectués."]
],
"Éducation":[
["Apprendre avec la répétition espacée","Revoir une notion à plusieurs moments aide à la mémoriser sur la durée.","Après avoir appris une notion, essaie de la retrouver le lendemain, puis quelques jours après et une semaine plus tard. Les intervalles peuvent être adaptés à la difficulté. Le rappel actif consiste à répondre sans regarder le cours, puis à vérifier la réponse.","Utilise des questions courtes ou des cartes mémoire plutôt que de relire passivement."],
["Construire un planning de travail réaliste","Un planning sert à répartir les tâches et à éviter de tout faire au dernier moment.","Liste les devoirs, les dates limites et les étapes nécessaires. Estime le temps de chaque tâche, donne la priorité aux échéances proches et garde des marges pour les imprévus. Un planning doit aussi préserver les pauses et le temps libre.","Prévois des objectifs précis comme « refaire trois exercices » plutôt que « travailler les maths »."],
["Prendre des notes efficacement","Les notes servent à conserver les idées essentielles et à faciliter les révisions.","Repère les notions importantes, les définitions, les exemples et les liens entre les idées. Utilise des titres et des mots-clés. Tu peux compléter les notes après le cours avec une question ou un résumé personnel.","Ne cherche pas à recopier chaque phrase prononcée : privilégie la compréhension."],
["Mieux comprendre un texte","Comprendre un texte consiste à identifier son sujet, ses idées et les relations entre elles.","Lis d'abord le titre et les sous-titres pour repérer le thème. Pendant la lecture, distingue les idées principales des exemples. Après chaque partie, reformule ce que tu as compris avec tes propres mots.","Si un mot bloque la compréhension, cherche sa définition puis relis la phrase entière."],
["Préparer un contrôle","Une préparation progressive permet de repérer les notions maîtrisées et celles à retravailler.","Commence par lister les chapitres concernés. Transforme les titres en questions, refais les exercices et vérifie les définitions. Termine par un entraînement sans le cours afin de repérer les lacunes.","Évite de découvrir tout le chapitre la veille : répartis le travail sur plusieurs jours."],
["Réussir un exposé oral","Un exposé clair présente une idée organisée et compréhensible pour le public.","Prépare une introduction qui annonce le sujet, plusieurs parties ordonnées et une conclusion. Les diapositives doivent soutenir la parole, pas contenir tout le texte. Entraîne-toi à voix haute et vérifie la durée.","Ne lis pas intégralement tes diapositives. Utilise des mots-clés pour guider ton explication."],
["Apprendre du vocabulaire dans une langue","Le vocabulaire se retient mieux lorsqu'il est réutilisé dans des contextes variés.","Associe chaque mot à sa signification, sa prononciation et une phrase d'exemple. Revois les mots à intervalles espacés. Regroupe-les par thème ou par situation pour mieux comprendre leurs usages.","Apprends aussi les expressions et les phrases, pas uniquement des listes isolées."],
["Comprendre une consigne scolaire","Une consigne précise ce qui est demandé et la manière de réaliser le travail.","Repère le verbe d'action : expliquer, comparer, justifier, calculer ou décrire. Identifie ensuite le sujet, les documents à utiliser et le format attendu. Reformule la consigne avant de commencer.","Souligne les verbes importants et vérifie que ta réponse correspond exactement à la demande."],
["Faire une fiche de révision","Une fiche synthétise les éléments essentiels d'un chapitre.","Sélectionne les définitions, formules, dates et idées importantes. Ajoute un exemple et une question de vérification. Organise la page avec des titres et des éléments visuels simples.","Une fiche doit être plus courte que le cours et compréhensible sans recopier tout le chapitre."],
["Résoudre un problème de mathématiques","La résolution d'un problème passe par la compréhension de la situation et le choix d'une méthode.","Lis l'énoncé, repère les données et ce que l'on cherche. Choisis une opération ou une formule adaptée, écris les étapes et vérifie si le résultat est cohérent avec les unités et l'ordre de grandeur.","Si tu bloques, commence par reformuler le problème et faire un schéma."],
["Développer son esprit critique","L'esprit critique consiste à examiner une information avant de l'accepter.","Distingue les faits, les opinions et les interprétations. Cherche l'auteur, la date, les preuves et le contexte. Compare plusieurs sources indépendantes, surtout lorsqu'une affirmation est étonnante ou importante.","Ne confonds pas popularité, nombre de partages et fiabilité."],
["Éviter la procrastination","La procrastination consiste à repousser une tâche alors qu'on sait qu'elle doit être faite.","Une tâche trop vague ou trop importante peut sembler difficile à commencer. Découpe-la en petites actions : ouvrir le document, lire une page, résoudre un exercice. Prépare le matériel avant la séance.","Commence par une étape courte et définie plutôt que d'attendre la motivation parfaite."],
["Comprendre les fractions","Une fraction représente une quantité divisée en parts égales.","Le numérateur indique le nombre de parts prises et le dénominateur le nombre de parts égales dans l'unité. Des fractions équivalentes représentent la même quantité. Pour additionner des fractions, il faut les exprimer avec un dénominateur commun.","Utilise un dessin ou une droite graduée pour visualiser les fractions."],
["Mémoriser une leçon avec des questions","Les questions obligent à retrouver activement les informations apprises.","Transforme chaque titre en question. Cache le cours et réponds de mémoire, puis vérifie. Classe les questions selon leur difficulté afin de consacrer plus de temps aux points mal maîtrisés.","Une réponse fausse est une indication utile sur ce qu'il faut revoir."],
["Organiser ses documents scolaires","Un classement régulier évite de perdre les cours et facilite les révisions.","Classe les documents par matière, puis par chapitre ou date. Garde les feuilles dans l'ordre et identifie les fichiers numériques avec un nom explicite. Prévois un emplacement pour les devoirs à rendre.","Fais un petit rangement chaque semaine plutôt qu'un grand tri avant les examens."]
],
"Réparation":[
["Diagnostiquer un ordinateur qui ne démarre plus","Un ordinateur peut refuser de démarrer à cause de l'alimentation, de l'écran ou d'un problème logiciel.","Observe les voyants, les sons et les messages affichés. Vérifie la prise et le chargeur sans utiliser de câble endommagé. Débranche les accessoires non indispensables. Si les voyants s'allument mais que l'écran reste noir, le problème peut concerner l'affichage ou un composant interne.","Arrête les essais en cas d'odeur de brûlé, de batterie gonflée ou de chaleur anormale. Fais appel à un réparateur."],
["Entretenir son smartphone","Un entretien régulier limite l'accumulation de poussière et certains dommages.","Nettoie l'écran avec un chiffon doux adapté. Évite les liquides dans les ouvertures et les objets pointus dans le port de charge. Une coque adaptée peut réduire certains dégâts liés aux chocs, sans rendre l'appareil incassable.","Consulte les recommandations du fabricant pour ton modèle avant tout nettoyage approfondi."],
["Comprendre une batterie qui se décharge vite","L'autonomie dépend de la batterie, de l'écran, des applications et des conditions d'utilisation.","La luminosité élevée, les jeux, la navigation GPS et une mauvaise réception réseau peuvent augmenter la consommation. Les batteries rechargeables perdent progressivement de leur capacité avec le temps et les cycles.","Consulte les statistiques de batterie pour repérer les applications très consommatrices."],
["Entretenir un clavier d'ordinateur","La poussière et les miettes peuvent gêner le fonctionnement des touches.","Éteins et débranche le clavier avant de le nettoyer. Utilise un chiffon doux et, si le fabricant l'autorise, de l'air adapté aux appareils électroniques. Ne verse jamais de liquide directement sur les touches.","Pour un clavier portable, évite de retirer les touches sans connaître la procédure prévue par le fabricant."],
["Comprendre un ordinateur qui chauffe","La chaleur provient notamment du processeur, de la carte graphique et des autres composants sollicités.","Les ventilateurs et les dissipateurs évacuent la chaleur. Des aérations obstruées, une pièce chaude ou une charge importante peuvent augmenter la température. Certains ordinateurs réduisent automatiquement leurs performances pour se protéger.","Pose l'appareil sur une surface stable et dégagée. N'obstrue pas ses aérations."],
["Diagnostiquer un écran qui clignote","Un scintillement peut être lié au câble, à l'écran, au pilote graphique ou au réglage de fréquence.","Vérifie les branchements et teste un autre câble compatible si possible. Contrôle la résolution et la fréquence de rafraîchissement recommandées par l'écran. Une mise à jour du pilote graphique peut parfois corriger un problème logiciel.","Si le défaut apparaît aussi sur un autre appareil, l'écran lui-même peut être en cause."],
["Comprendre les problèmes de charge d'un téléphone","Une charge lente ou interrompue peut provenir du chargeur, du câble, du port ou de la batterie.","Teste un chargeur compatible en bon état. Vérifie visuellement le port sans y introduire d'objet métallique. La température peut aussi limiter temporairement la charge. Un message d'humidité ou une alerte doit être pris au sérieux.","N'utilise pas de câble abîmé et ne tente pas de réparer une batterie gonflée."],
["Entretenir une souris d'ordinateur","La poussière et les saletés peuvent gêner le capteur ou les boutons.","Débranche la souris ou éteins-la. Nettoie la surface et les zones accessibles avec un chiffon doux. Pour une souris optique, vérifie que la surface utilisée est adaptée au capteur.","Évite les produits liquides dans les boutons et la molette."],
["Comprendre un disque dur bruyant","Un disque dur mécanique contient des pièces mobiles qui peuvent produire certains sons.","Un bruit inhabituel, des clics répétés ou des erreurs de lecture peuvent signaler un problème. Les SSD ne possèdent pas les mêmes pièces mécaniques. En cas de signes de défaillance, les données deviennent prioritaires.","Sauvegarde les fichiers importants si le disque reste accessible et demande un diagnostic professionnel."],
["Résoudre un problème d'imprimante","Les erreurs d'impression peuvent venir de la connexion, du papier, de l'encre ou du logiciel.","Vérifie l'alimentation, le papier, les voyants et la connexion. Contrôle que la bonne imprimante est sélectionnée. Une file d'attente bloquée peut empêcher les nouveaux documents de partir.","Suis les instructions du fabricant pour retirer un bourrage papier sans forcer."],
["Entretenir un ventilateur domestique","La poussière accumulée peut réduire le débit d'air et augmenter le bruit.","Débranche l'appareil avant le nettoyage. Consulte la notice pour savoir si la grille peut être retirée. Nettoie les surfaces accessibles sans mouiller le moteur ni les parties électriques.","Ne démonte pas les éléments électriques si tu n'es pas qualifié."],
["Comprendre une connexion Internet instable","Une connexion instable peut provenir du Wi-Fi, de la box, du fournisseur ou de l'appareil.","Compare plusieurs appareils et, si possible, teste une connexion filaire. Vérifie les voyants de la box et les éventuelles interruptions signalées par le fournisseur. La distance et les obstacles peuvent réduire le signal Wi-Fi.","Redémarre la box selon les instructions de ton fournisseur et note les heures des coupures."],
["Diagnostiquer un appareil qui ne s'allume plus","L'absence de démarrage peut avoir une origine électrique, mécanique ou logicielle.","Vérifie d'abord les éléments externes accessibles : prise, interrupteur, câble et chargeur adapté. Cherche un voyant ou un message. Consulte la notice pour les procédures de réinitialisation prévues par le fabricant.","Ne démonte pas un appareil branché au secteur. Demande une intervention qualifiée si nécessaire."],
["Entretenir une console de jeux","Une console a besoin d'une circulation d'air correcte pour fonctionner dans de bonnes conditions.","Installe-la sur une surface stable et laisse de l'espace autour des aérations. Nettoie les surfaces extérieures avec un chiffon doux. Vérifie régulièrement les mises à jour du système et des jeux.","N'utilise pas d'aspirateur ou d'objet dans les ouvertures sans suivre les consignes du fabricant."],
["Préparer un appareil avant une réparation","Une préparation adaptée protège les données et facilite l'intervention.","Sauvegarde les fichiers, note le modèle et décris précisément la panne. Retire les accessoires non nécessaires et consulte les conditions de garantie. Certains appareils disposent d'un mode de maintenance ou d'une procédure de protection des données.","Ne communique jamais ton mot de passe personnel à un réparateur sans raison claire. Demande quelles données seront accessibles."]
],
"Maison":[
["Économiser l'électricité à la maison","Réduire sa consommation électrique peut limiter les dépenses et l'impact environnemental.","La consommation se mesure en kilowattheures. Elle dépend de la puissance de l'appareil et de sa durée d'utilisation. Le chauffage, l'eau chaude, la cuisson et les équipements électriques peuvent peser différemment selon le logement.","Compare les relevés sur des périodes similaires et adapte les habitudes aux appareils utilisés."],
["Organiser son espace de travail","Un espace rangé facilite la concentration et la recherche du matériel.","Garde à portée de main les objets utilisés souvent. Classe les documents dans des dossiers et limite les éléments qui encombrent la surface. Un éclairage adapté et une position confortable améliorent les conditions de travail.","Range quelques minutes après chaque séance pour éviter l'accumulation."],
["Trier correctement ses déchets","Le tri permet de diriger certains matériaux vers les filières de recyclage adaptées.","Les consignes peuvent varier selon la commune et les filières locales. Les emballages, le verre, les papiers, les déchets alimentaires et les déchets dangereux ne suivent pas toujours les mêmes circuits.","Consulte les consignes de ta commune plutôt que de supposer que tous les objets se trient de la même manière."],
["Réduire le gaspillage alimentaire","Une meilleure organisation des repas aide à utiliser les aliments avant qu'ils ne soient perdus.","Planifie quelques repas, vérifie les placards avant les courses et range les produits selon leur conservation. La date limite de consommation et la date de durabilité minimale n'ont pas la même signification.","Respecte les indications de conservation et ne consomme pas un aliment douteux."],
["Comprendre les étiquettes énergétiques","L'étiquette énergétique aide à comparer la performance de certains appareils.","L'étiquette européenne présente une classe énergétique et des informations propres au produit, comme la consommation, le volume ou le bruit. Les critères diffèrent selon les familles d'appareils.","Compare des appareils de même catégorie et de capacité similaire."],
["Entretenir son réfrigérateur","Un réfrigérateur propre et correctement réglé conserve les aliments dans de bonnes conditions.","Évite de surcharger les espaces de circulation d'air. Vérifie les joints, nettoie les surfaces et respecte les consignes de température du fabricant. Laisse refroidir les plats avant de les ranger selon les recommandations sanitaires.","Ne bloque pas les aérations intérieures et vérifie régulièrement la fermeture de la porte."],
["Organiser le rangement d'une pièce","Un rangement fonctionnel facilite l'utilisation quotidienne de l'espace.","Regroupe les objets par usage, place les éléments fréquents à portée de main et identifie les endroits réservés au rangement. Les boîtes étiquetées permettent de retrouver plus facilement les objets.","Évite d'empiler des objets lourds en hauteur ou de bloquer les passages."],
["Réduire sa consommation d'eau","Les gestes quotidiens et les équipements influencent la quantité d'eau utilisée.","Un robinet qui fuit peut gaspiller de l'eau au fil du temps. Les douches, les toilettes, le lavage et l'arrosage représentent différents usages. Les équipements économes peuvent réduire certains débits.","Signale une fuite importante à un adulte ou au responsable du logement."],
["Comprendre le chauffage d'un logement","Le chauffage compense les pertes de chaleur du logement pour maintenir une température intérieure.","L'isolation, les fenêtres, la ventilation et le réglage du système influencent le confort et la consommation. Les besoins varient selon les pièces, la météo et l'occupation.","Ne couvre jamais un radiateur et ne modifie pas une installation de chauffage sans compétence."],
["Nettoyer les surfaces sans les abîmer","Les matériaux ne réagissent pas tous de la même manière aux produits de nettoyage.","Le bois, le verre, l'inox et les surfaces peintes demandent parfois des méthodes différentes. Un produit trop agressif peut ternir, décolorer ou endommager une surface.","Lis l'étiquette du produit et teste d'abord sur une petite zone discrète."],
["Bien conserver les aliments","La conservation dépend de la température, de l'emballage et de la nature de l'aliment.","Respecte les températures indiquées, sépare les aliments crus et cuits et utilise des contenants adaptés. Les indications de date sur les emballages permettent de guider la consommation.","En cas de doute sur la sécurité d'un aliment, ne prends pas de risque."],
["Préparer un déménagement","Une préparation progressive réduit les oublis et facilite le transport des affaires.","Fais un inventaire, trie les objets, prépare les cartons par pièce et indique leur contenu. Garde à part les documents importants et les objets nécessaires le jour du déménagement.","Ne surcharge pas les cartons et demande de l'aide pour les objets lourds."],
["Comprendre le compostage","Le compostage transforme certains déchets organiques en matière utile pour le sol.","Les déchets végétaux peuvent être compostés avec un équilibre entre matières humides et matières sèches. L'aération et l'humidité influencent la décomposition. Tous les déchets alimentaires ne sont pas adaptés à tous les composteurs.","Vérifie les consignes du composteur collectif ou local avant d'y déposer des déchets."],
["Limiter les pertes de chaleur","L'isolation et l'étanchéité réduisent les échanges de chaleur entre intérieur et extérieur.","Les combles, les murs, les fenêtres et les portes peuvent contribuer aux pertes thermiques. Les rideaux et joints peuvent aider dans certaines situations, mais ne remplacent pas une isolation adaptée.","Demande un diagnostic qualifié avant d'entreprendre des travaux importants."],
["Créer une routine de rangement","Une routine courte et régulière aide à maintenir un espace ordonné.","Choisis quelques actions simples : remettre les objets à leur place, trier le courrier, vider les surfaces et préparer les affaires du lendemain. Une routine fonctionne mieux lorsqu'elle est adaptée au rythme du foyer.","Commence par une seule petite habitude et ajoute les autres progressivement."]
],
"Sécurité":[
["Créer des mots de passe solides","Un mot de passe unique et difficile à deviner protège mieux un compte.","Privilégie une phrase de passe longue et différente pour chaque service. Évite les informations personnelles et les mots de passe réutilisés. Un gestionnaire peut générer et conserver des identifiants uniques.","Active l'authentification multifacteur sur les comptes importants."],
["Reconnaître les tentatives de phishing","L'hameçonnage cherche à tromper une personne pour obtenir des informations ou provoquer une action.","Un message peut imiter une banque, un transporteur ou une administration. Observe l'adresse de l'expéditeur, le domaine du lien, le caractère inattendu du message et les demandes urgentes. Un logo ne prouve pas l'authenticité.","Ouvre toi-même l'application ou le site officiel au lieu de cliquer sur un lien reçu."],
["Protéger ses données personnelles","Les données personnelles peuvent permettre d'identifier directement ou indirectement une personne.","Un nom, une adresse, une photo, une localisation ou un identifiant peuvent être des données personnelles. Avant de partager une information, demande-toi qui pourra la voir, combien de temps elle restera accessible et pourquoi elle est demandée.","Limite les informations publiées et vérifie les paramètres de confidentialité."],
["Sécuriser ses réseaux sociaux","Les paramètres de confidentialité permettent de contrôler une partie de la visibilité des publications.","Vérifie qui peut voir tes publications, t'envoyer des messages ou retrouver ton profil. Les contenus partagés peuvent être copiés ou capturés même après suppression.","Évite de publier des informations permettant de connaître tes habitudes ou tes déplacements."],
["Reconnaître une arnaque en ligne","Une arnaque utilise la tromperie pour obtenir de l'argent, des données ou un avantage.","Méfie-toi des offres trop belles, des demandes de paiement inhabituelles, des faux concours et des personnes qui mettent la pression. Vérifie l'identité du vendeur ou de l'organisme avec des sources indépendantes.","Ne paie pas dans l'urgence et demande conseil en cas de doute."],
["Protéger son smartphone","Un téléphone contient souvent des messages, photos, comptes et données personnelles.","Utilise un verrouillage d'écran, installe les mises à jour et limite les autorisations des applications. Active les fonctions de localisation ou de verrouillage à distance proposées par le fabricant si elles te conviennent.","Ne laisse pas ton appareil déverrouillé sans surveillance."],
["Comprendre l'authentification à deux facteurs","Cette méthode demande une preuve supplémentaire en plus du mot de passe.","Le deuxième facteur peut être une application d'authentification, une clé de sécurité ou une validation sur un appareil. Il réduit les risques liés au vol d'un mot de passe seul.","Ne valide jamais une notification de connexion que tu n'as pas demandée."],
["Sécuriser sa messagerie électronique","La messagerie est souvent utilisée pour réinitialiser les mots de passe d'autres comptes.","Protège-la avec un mot de passe unique et une authentification multifacteur. Vérifie les règles de transfert, les appareils connectés et les coordonnées de récupération.","En cas de connexion inconnue, change ton mot de passe depuis le site officiel et vérifie les sessions."],
["Comprendre les cookies","Les cookies sont de petites données enregistrées par un site dans le navigateur.","Certains cookies servent au fonctionnement du site ou à conserver une session. D'autres peuvent être utilisés pour mesurer l'audience ou personnaliser la publicité. Les règles de consentement dépendent de leur finalité.","Vérifie les choix proposés par les sites et les paramètres de ton navigateur."],
["Se protéger sur un Wi-Fi public","Un réseau public peut présenter des risques si l'on ne vérifie pas le réseau et les services utilisés.","Vérifie le nom exact du réseau auprès de l'établissement. Privilégie les sites utilisant HTTPS et évite de saisir des informations sensibles sur un appareil partagé ou douteux.","Désactive le partage de fichiers lorsque tu n'en as pas besoin."],
["Reconnaître une fausse assistance technique","Une fausse assistance prétend qu'un appareil est infecté pour pousser à payer ou à installer un outil.","Un message alarmant dans une page Web ne prouve pas que l'ordinateur est infecté. Les fraudeurs peuvent se faire passer pour un fabricant ou un service connu et réclamer un accès à distance.","Ferme la page, ne communique aucun code et contacte le support officiel si nécessaire."],
["Faire face à une fuite de données","Une fuite peut exposer des informations personnelles ou des identifiants.","Si un service annonce une fuite, vérifie l'information par son canal officiel. Change le mot de passe concerné et tous les mots de passe réutilisés. Surveille les messages inhabituels et les connexions inconnues.","Sécurise en priorité ta messagerie, car elle permet souvent de récupérer d'autres comptes."],
["Protéger ses photos en ligne","Une photo peut révéler davantage que ce que l'on pense, notamment son lieu ou son contexte.","Avant de publier, vérifie les personnes visibles, les informations à l'arrière-plan et les paramètres de partage. Certaines images peuvent contenir des métadonnées selon l'appareil et le service utilisé.","Demande l'accord des personnes concernées avant de publier leur image."],
["Comprendre les logiciels malveillants","Un logiciel malveillant est conçu pour perturber un appareil, espionner ou accéder à des données sans autorisation.","Les catégories comprennent les virus, chevaux de Troie, logiciels espions et rançongiciels. Ils peuvent arriver par une pièce jointe, un téléchargement douteux ou une faille logicielle.","Maintiens les appareils à jour et utilise des logiciels provenant de sources fiables."],
["Réagir à un compte compromis","Un compte compromis peut être utilisé par une autre personne sans autorisation.","Depuis le service officiel, change le mot de passe, ferme les sessions inconnues et vérifie les coordonnées de récupération. Si le même mot de passe était utilisé ailleurs, change-le aussi sur ces services.","Préviens les contacts concernés si des messages suspects ont été envoyés depuis ton compte."]
],
"Technologie":[
["Comprendre l'intelligence artificielle","L'intelligence artificielle regroupe des techniques permettant à des systèmes d'effectuer certaines tâches complexes.","Les systèmes d'IA peuvent classer des images, reconnaître la parole, recommander des contenus ou produire du texte. Les modèles apprennent des régularités à partir de données et de méthodes d'entraînement. Ils ne sont pas automatiquement conscients.","Vérifie les réponses importantes : une IA peut produire des informations fausses ou incomplètes."],
["Comprendre le fonctionnement d'Internet","Internet est un réseau mondial de réseaux informatiques qui échangent des données.","Les appareils communiquent grâce à des protocoles. IP sert notamment à adresser et acheminer les paquets. DNS permet de retrouver l'adresse IP associée à un nom de domaine. Le Web est un service qui utilise Internet.","Le Wi-Fi est une technologie de réseau sans fil, pas un synonyme d'Internet."],
["Découvrir la réalité virtuelle","La réalité virtuelle crée un environnement numérique dans lequel l'utilisateur peut être immergé.","Un casque affiche des images différentes pour chaque œil et suit les mouvements de la tête. Certains systèmes suivent également les mains ou les contrôleurs. Le rendu doit être suffisamment fluide pour rester confortable.","Respecte les recommandations d'âge, de durée et d'espace libre du fabricant."],
["Comprendre la réalité augmentée","La réalité augmentée ajoute des éléments numériques à une vue du monde réel.","Un smartphone ou un casque utilise des caméras et des capteurs pour estimer la position et afficher des objets virtuels dans l'environnement. Elle peut servir à l'apprentissage, à la visualisation ou à l'assistance.","Vérifie toujours ton environnement réel : l'affichage numérique ne remplace pas l'observation."],
["Comprendre les objets connectés","Un objet connecté collecte ou échange des informations avec d'autres appareils ou services.","Une montre, une enceinte ou un thermostat peut communiquer par Wi-Fi, Bluetooth ou un autre protocole. L'application associée permet parfois de consulter des données et de modifier des réglages.","Examine les autorisations, les mises à jour et les paramètres de confidentialité."],
["Découvrir l'impression 3D","L'impression 3D fabrique un objet en ajoutant de la matière couche après couche.","Dans la fabrication par dépôt de filament, une matière plastique est chauffée puis déposée selon un parcours calculé. D'autres technologies utilisent des résines ou des poudres. Le modèle numérique doit être préparé avant l'impression.","Respecte les consignes du fabricant concernant la chaleur, la ventilation et les matériaux."],
["Comprendre le GPS","Le GPS utilise des signaux de satellites pour estimer une position sur Terre.","Un récepteur compare les temps de propagation de plusieurs signaux satellitaires. La qualité de la position dépend notamment de la visibilité du ciel, des obstacles et des conditions de réception.","Une position GPS peut être imprécise dans les bâtiments ou entre de grands immeubles."],
["Comprendre les batteries rechargeables","Une batterie rechargeable stocke de l'énergie sous forme chimique et la restitue sous forme électrique.","Les batteries lithium-ion sont courantes dans les téléphones et ordinateurs. Leur capacité évolue avec l'âge, la température et les cycles d'utilisation. Les systèmes électroniques surveillent la charge et la température.","Évite les températures extrêmes et utilise un chargeur compatible."],
["Comprendre les panneaux solaires","Les panneaux photovoltaïques convertissent une partie de la lumière en énergie électrique.","Les cellules photovoltaïques produisent un courant continu. Un onduleur peut le convertir en courant alternatif utilisable dans une installation. La production dépend de l'ensoleillement, de l'orientation, de l'ombre et de la température.","Une étude de toiture et un professionnel qualifié sont nécessaires pour un projet d'installation."],
["Comprendre le Bluetooth","Bluetooth est une technologie de communication sans fil à courte portée.","Elle permet à des appareils comme des écouteurs, claviers et téléphones d'échanger des données. L'appairage établit une relation entre les appareils et certains profils définissent les usages possibles.","Désactive les connexions que tu n'utilises pas et refuse les demandes d'appairage inconnues."],
["Découvrir les véhicules électriques","Un véhicule électrique utilise un moteur alimenté par une batterie rechargeable.","La batterie fournit l'énergie au moteur électrique. Le freinage régénératif peut récupérer une partie de l'énergie lors des ralentissements. L'autonomie dépend de la vitesse, de la température, du relief et de l'utilisation du chauffage ou de la climatisation.","Compare l'autonomie annoncée avec les conditions réelles et les besoins de déplacement."],
["Comprendre les écrans OLED et LCD","OLED et LCD sont deux technologies d'affichage qui produisent les images différemment.","Un écran LCD utilise un rétroéclairage et des cristaux liquides pour contrôler la lumière. Un écran OLED utilise des pixels qui émettent leur propre lumière. Les différences influencent notamment le contraste, la luminosité et la consommation selon l'image affichée.","Compare la qualité d'image dans les conditions d'utilisation qui t'intéressent."],
["Comprendre le fonctionnement d'un robot","Un robot combine des capteurs, un système de commande et des actionneurs.","Les capteurs recueillent des informations sur l'environnement. Le contrôleur traite ces données et commande les moteurs ou autres actionneurs. Certains robots suivent un programme fixe, tandis que d'autres adaptent leur comportement à partir des capteurs.","Un robot n'est pas forcément autonome : beaucoup nécessitent une commande ou une supervision."],
["Découvrir les réseaux 5G","La 5G est une génération de réseaux mobiles conçue pour améliorer certaines communications sans fil.","Elle peut offrir des débits élevés, une capacité accrue et des temps de réponse réduits dans certaines conditions. Les performances dépendent de la couverture, des fréquences, du terminal et du nombre d'utilisateurs.","Vérifie la couverture réelle de ton opérateur à l'endroit où tu utilises ton téléphone."],
["Comprendre les centres de données","Un centre de données héberge des serveurs et des équipements qui fournissent des services numériques.","Il regroupe des serveurs, du stockage, des équipements réseau, des systèmes de refroidissement et une alimentation électrique sécurisée. Les services cloud reposent souvent sur de telles infrastructures.","La consommation énergétique et la gestion de la chaleur sont des enjeux importants de ces installations."]
]
};

const sourceByCategory={
"Informatique":[["Microsoft Support","https://support.microsoft.com/fr-fr/windows"],["MDN Web Docs","https://developer.mozilla.org/fr/"]],
"Éducation":[["Éduscol","https://eduscol.education.fr/"],["Onisep","https://www.onisep.fr/"]],
"Réparation":[["iFixit — Guides de réparation","https://www.ifixit.com/"],["Assistance Samsung","https://www.samsung.com/fr/support/"]],
"Maison":[["ADEME — Agir pour la transition","https://agirpourlatransition.ademe.fr/particuliers/"],["Service public","https://www.service-public.fr/"]],
"Sécurité":[["CNIL","https://www.cnil.fr/"],["Cybermalveillance.gouv.fr","https://www.cybermalveillance.gouv.fr/"],["ANSSI","https://cyber.gouv.fr/"]],
"Technologie":[["CNIL — Intelligence artificielle","https://www.cnil.fr/fr/intelligence-artificielle"],["Commission européenne — Numérique","https://digital-strategy.ec.europa.eu/fr"]]
};

let guides=[];
let nextId=1;
for(const category of categories){
 for(const item of raw[category.name]){
  guides.push({
   id:nextId++,
   category:category.name,
   title:item[0],
   intro:item[1],
   details:item[2],
   advice:item[3],
   sources:sourceByCategory[category.name]
  });
 }
}

let currentView="home",currentCategory="",currentQuery="";

function esc(s){
 return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
function favorites(){
 try{return JSON.parse(localStorage.getItem("solveoFavorites")||"[]")}
 catch{return []}
}
function toggleFavorite(id){
 let f=favorites();
 if(f.includes(id))f=f.filter(x=>x!==id);else f.push(id);
 localStorage.setItem("solveoFavorites",JSON.stringify(f));
 if(currentView==="article")openGuide(id);
 else if(currentView==="favorites")favoritesPage();
 else if(currentView==="category")openCategory(currentCategory);
 else if(currentView==="results")search(currentQuery);
 else home();
}
function card(g){
 return `<div class="guide-card">
 <span class="tag">${esc(g.category)}</span>
 <h3>${esc(g.title)}</h3>
 <p>${esc(g.intro)}</p>
 <div class="actions">
 <button class="small red" onclick="openGuide(${g.id})">Lire le guide</button>
 <button class="small" onclick="toggleFavorite(${g.id})">${favorites().includes(g.id)?"★ Favori":"☆ Favori"}</button>
 </div></div>`;
}
function hideHero(){document.getElementById("hero").style.display="none"}
function showHero(){document.getElementById("hero").style.display="block"}
function home(){
 currentView="home";showHero();
 document.getElementById("content").innerHTML=`
 <h2 class="section-title">Explore les <span>catégories</span></h2>
 <div class="category-grid">${categories.map(c=>`
 <div class="category-card" onclick="openCategory('${c.name}')">
 <div class="category-icon">${c.icon}</div><h3>${c.name}</h3>
 <p>${c.description}</p><small style="color:#ff5555">15 guides disponibles</small>
 </div>`).join("")}</div>
 <h2 class="section-title" style="margin-top:45px">Quelques <span>guides</span></h2>
 <div class="guide-grid">${guides.slice(0,6).map(card).join("")}</div>`;
}
function categoriesPage(){
 currentView="categories";hideHero();
 document.getElementById("content").innerHTML=`
 <h2 class="section-title">Toutes les <span>catégories</span></h2>
 <div class="category-grid">${categories.map(c=>`
 <div class="category-card" onclick="openCategory('${c.name}')">
 <div class="category-icon">${c.icon}</div><h3>${c.name}</h3>
 <p>${c.description}</p><small style="color:#ff5555">15 guides</small>
 </div>`).join("")}</div>`;
}
function openCategory(name){
 currentView="category";currentCategory=name;hideHero();
 const list=guides.filter(g=>g.category===name);
 document.getElementById("content").innerHTML=`
 <button class="back" onclick="categoriesPage()">← Catégories</button>
 <h2 class="section-title">${esc(name)} <span>— 15 guides</span></h2>
 <div class="guide-grid">${list.map(card).join("")}</div>`;
}
function openGuide(id){
 const g=guides.find(x=>x.id===id);if(!g)return;
 currentView="article";hideHero();
 document.getElementById("content").innerHTML=`
 <div class="article">
 <button class="back" onclick="goBack()">← Retour</button>
 <div class="tag">${esc(g.category)}</div>
 <h1>${esc(g.title)}</h1>
 <p class="intro">${esc(g.intro)}</p>
 <button class="small red" onclick="toggleFavorite(${g.id})">${favorites().includes(g.id)?"★ Retirer des favoris":"☆ Ajouter aux favoris"}</button>
 <section class="article-section"><h2>1. Comprendre le sujet</h2><p>${esc(g.details)}</p></section>
 <section class="article-section"><h2>2. Conseils pratiques</h2><div class="tip">${esc(g.advice)}</div></section>
 <section class="article-section"><h2>3. À retenir</h2><p>Chaque situation peut être différente. Vérifie les consignes du fabricant ou les recommandations officielles lorsqu'elles s'appliquent. Pour une intervention technique ou une décision importante, demande conseil à une personne compétente.</p></section>
 <section class="article-section"><h2>📚 Sources pour approfondir</h2>
 ${g.sources.map(s=>`<p><a href="${s[1]}" target="_blank" rel="noopener noreferrer">${esc(s[0])} ↗</a></p>`).join("")}
 </section></div>`;
}
function goBack(){
 if(currentView==="article"){
  if(currentCategory && guides.some(g=>g.category===currentCategory))openCategory(currentCategory);
  else home();
 }
}
function favoritesPage(){
 currentView="favorites";hideHero();
 const list=guides.filter(g=>favorites().includes(g.id));
 document.getElementById("content").innerHTML=`
 <h2 class="section-title">⭐ Mes <span>favoris</span></h2>
 ${list.length?`<div class="guide-grid">${list.map(card).join("")}</div>`:`<div class="empty">Aucun favori pour le moment. Ajoute un guide avec le bouton ☆ Favori.</div>`}`;
}
function search(query){
 if(typeof query!=="string")query=document.getElementById("searchInput").value;
 currentQuery=query;currentView="results";showHero();
 document.getElementById("searchInput").value=query;
 const q=query.trim().toLowerCase();
 const results=guides.filter(g=>
 g.title.toLowerCase().includes(q)||
 g.category.toLowerCase().includes(q)||
 g.intro.toLowerCase().includes(q)||
 g.details.toLowerCase().includes(q)||
 g.advice.toLowerCase().includes(q)
 );
 document.getElementById("content").innerHTML=`
 <h2 class="section-title">Résultats de <span>recherche</span></h2>
 <p style="color:#aaa">${results.length} résultat(s) pour « ${esc(query)} »</p>
 ${results.length?`<div class="guide-grid">${results.map(card).join("")}</div>`:`<div class="empty">Aucun guide trouvé. Essaie un autre mot-clé.</div>`}`;
}
home();
</script>
</body>
</html>
